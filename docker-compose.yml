
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: kubernetes-rag-litellm

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"

    ports:
      - "127.0.0.1:4000:4000"

    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

    env_file:
      - .env

    restart: unless-stopped
