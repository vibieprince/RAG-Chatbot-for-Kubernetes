name: Deploy Recruiter Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'recruiter-site/**'
      - '.github/workflows/deploy-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job: compile Tailwind CSS and package static assets
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & compile Tailwind CSS
        working-directory: recruiter-site
        run: |
          npm install
          npm run build:css

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'recruiter-site/dist'

  # Deployment job: deploy uploaded artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
